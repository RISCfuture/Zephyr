name: Release

# Pushing a version tag builds both editions: the App Store build is uploaded to App Store Connect,
# and the downloadable build is notarized, packaged as an installer package, published as a GitHub
# release, and handed to the Homebrew tap. Nothing here re-runs the tests: tag a commit CI has
# already passed.
#
# The project is the version source. A tag names the version it releases, and the run refuses it
# unless both editions' MARKETING_VERSION matches and the commit is on main or a release/* branch;
# the build number comes from App Store Connect.
#
# The App Store build's notes are written and the build attached to its version once Apple has
# processed it, leaving only the submission by hand.
#
# Re-tagging a version is how its build is replaced. The tag push runs all of this again and the
# version ends up pointing at the newer build; the older one stays on App Store Connect, since a
# build can be expired but never deleted. A tag push is a deploy, not bookkeeping.
#
# Tags carry no "v" prefix. The in-app update checker compares release tags against
# CFBundleShortVersionString, so "1.2" is the tag for version 1.2.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, which must match the project's MARKETING_VERSION.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The editions are released by two calls rather than one matrix, so the GitHub release waits on
  # the installer package alone and not on App Store Connect processing the store build, which can
  # take most of an hour and fail on its own account. Each call resolves the build number before
  # either has uploaded anything, so both editions carry the same one.
  store:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@1.2.0
    with:
      # The image the release runs on. GitHub names its macOS images after the major Xcode version
      # they carry rather than the OS they run.
      runner: xcode-27
      # Not a platform in the Apple sense — it is macOS. The reusable workflow passes it through to
      # the release lane verbatim, and `ci_release` reads it as an edition name.
      platforms: '["mas"]'
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      # Before the build number is even resolved, on a runner with no credentials: a release that
      # cannot succeed then costs seconds instead of the whole archive. By the time the archive has
      # run a build has reached App Store Connect, and neither that upload nor the tag can be taken
      # back.
      verify-lane: ci_verify_release
      # After the upload. Writes the version's notes and attaches the build once Apple has
      # processed it — a version cannot hold a build that is still processing, which is why this
      # cannot run when the upload does.
      finish-lane: ci_finish_release
      # The default 60 is close for an archive with nothing to build from scratch first; this
      # leaves room for a slow upload rather than losing the archive to a timeout.
      timeout-minutes: 90
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  download:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@1.2.0
    with:
      runner: xcode-27
      platforms: '["download"]'
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      verify-lane: ci_verify_release
      # Room for two notarizations, the app's and the package's, rather than losing the archive to
      # a timeout.
      timeout-minutes: 90
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  publish:
    name: Publish GitHub release
    needs: download
    # Nothing here is Apple-specific: both artifacts arrive already built and notarized.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Only the downloadable edition produces these; the App Store edition's build went straight to
      # App Store Connect and leaves nothing to attach here.
      - name: Download the notarized artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-download-${{ inputs.version || github.ref_name }}
          path: artifacts

      # One asset, and deliberately so. The update checker hands the user whichever asset the
      # release carries, and only this one installs a Zephyr that works: an app dragged out of a
      # disk image is quarantined, and a quarantined Zephyr is one macOS will not run a File
      # Provider extension for.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -o pipefail
          pkg=$(find artifacts -name '*.pkg' -print -quit)
          if [ -z "$pkg" ]; then
            echo "::error::The release artifacts are missing an installer package."
            exit 1
          fi

          # From CHANGELOG.md, not --generate-notes: most work here lands as direct commits rather
          # than pull requests, so generated notes would describe a fraction of the release. The
          # same text is what App Store Connect carries as "What's New".
          Scripts/release-notes.sh "$VERSION" > release-notes.md

          # A release for the tag can already exist — this job re-run after a later failure, or
          # a release cut by hand. `gh release create` refuses a duplicate outright, which leaves
          # a built and notarized pair of artifacts with nowhere to go, so an existing release
          # takes the assets instead of stopping the run.
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              "$pkg"
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Zephyr $VERSION" \
              --notes-file release-notes.md \
              "$pkg"
          fi

      # Only once the release and its installer package are up: the tap's audit checks the cask's
      # version against the latest GitHub release, and its URL against the asset. -f rather than -F,
      # which would send the version as a number and turn 1.10 into 1.1.
      - name: Bump the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh api repos/RISCfuture/homebrew-tap/dispatches \
            -f event_type=cask-release \
            -f 'client_payload[cask]=zephyr' \
            -f "client_payload[version]=${VERSION}"
