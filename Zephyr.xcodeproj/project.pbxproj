		0AC0000000000000000000C4 /* Upload Debug Symbols to Sentry */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(SRCROOT)/.sentryclirc",
			);
			name = "Upload Debug Symbols to Sentry";
			runOnlyForDeploymentPostprocessing = 1;
			shellPath = /bin/sh;
			shellScript = (
				"# Uploads this build's debug symbols and source context to Sentry, so a crash report from it",
				"# arrives symbolicated and with the failing lines attached. Runs only for an install build, which",
				"# is what an archive does; an ordinary Debug build uploads nothing.",
				"#",
				"# Org and project come from .sentryclirc, which is why this changes directory first: sentry-cli",
				"# looks for that file in the working directory. Only the auth token is passed in, through",
				"# SENTRY_AUTH_TOKEN.",
				"#",
				"#",
				"# The dSYM is deliberately not declared as an input. Both editions build a Zephyr.app, so that",
				"# path is the same string in either target, and joining their graphs on it makes their identical",
				"# products collide. alwaysOutOfDate already runs this every build, so inputs would buy nothing.",
				"# Nothing here may fail the build. A machine without sentry-cli, or without a token, still",
				"# produces a shippable app — fastlane's release lanes upload the same symbols out of the archive,",
				"# and that is what makes symbolication a property of the release rather than of whoever archived",
				"# it.",
				"if ! command -v sentry-cli >/dev/null 2>&1; then",
				"  if [ -x /opt/homebrew/bin/sentry-cli ]; then",
				"    PATH=\"/opt/homebrew/bin:$PATH\"",
				"  elif [ -x /usr/local/bin/sentry-cli ]; then",
				"    PATH=\"/usr/local/bin:$PATH\"",
				"  else",
				"    echo \"warning: sentry-cli not installed, so this build's symbols went nowhere; see https://github.com/getsentry/sentry-cli/releases\"",
				"    exit 0",
				"  fi",
				"  export PATH",
				"fi",
				"",
				"cd \"${SRCROOT}\" || exit 0",
				"",
				"if ! ERROR=$(sentry-cli debug-files upload --include-sources \"${DWARF_DSYM_FOLDER_PATH}\" 2>&1 >/dev/null); then",
				"  echo \"warning: sentry-cli - ${ERROR}\"",
				"fi",
				"",
			);
		};
