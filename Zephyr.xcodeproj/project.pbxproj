		01EFFC013038B10000829710 /* Sign Embedded Command-Line Tool */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(SRCROOT)/Zephyr-download/CommandLineTool.entitlements",
			);
			name = "Sign Embedded Command-Line Tool";
			shellPath = /bin/sh;
			shellScript = (
				"# Code-Sign-On-Copy signs the embedded tool with no entitlements at all, but zephyr-cli",
				"# reaches the app group container (see ZephyrEnvironment.standard), so without",
				"# com.apple.security.application-groups it traps the moment it resolves a session.",
				"# Re-sign it here, before the app bundle is sealed around it.",
				"#",
				"# Deliberately NOT com.apple.security.inherit: the app installs this tool into",
				"# /usr/local/bin (CommandLineToolInstaller) and the user runs it from a shell, where a",
				"# binary signed to inherit a sandbox is aborted by libsystem_secinit with \"Process is",
				"# not in an inherited sandbox\".",
				"if [ \"${CODE_SIGNING_ALLOWED}\" = \"NO\" ]; then",
				"  echo \"note: code signing disabled; leaving the embedded tool unsigned\"",
				"  exit 0",
				"fi",
				"",
				"IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY}}\"",
				"TOOL=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/zephyr-cli\"",
				"",
				"[ -f \"${TOOL}\" ] || { echo \"error: embedded tool missing at ${TOOL}\"; exit 1; }",
				"codesign --force --sign \"${IDENTITY}\" \\",
				"  --entitlements \"${SRCROOT}/Zephyr-download/CommandLineTool.entitlements\" \\",
				"  --options runtime \\",
				"  \"${TOOL}\" || exit 1",
				"",
			);
		};
